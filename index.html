<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>40 Kat Büyüme Hedefi</title>
<style>
:root{--bg:#faf3e0;--card:#fff;--tx:#2b2418;--mu:#7a6c52;--ac:#2f7d4f;--bd:#e3d5b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140e;--card:#221d13;--tx:#f2ead6;--mu:#a89973;--ac:#4fc17f;--bd:#3a3220}}
:root[data-theme="dark"]{--bg:#17140e;--card:#221d13;--tx:#f2ead6;--mu:#a89973;--ac:#4fc17f;--bd:#3a3220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mu);font-size:14px;margin-bottom:14px}
.prog{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.row{display:flex;justify-content:space-between;font-size:14px}
.row b{font-size:16px}
label.t{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
label.t input{width:24px;height:24px;accent-color:var(--ac);flex:none}
.n{width:28px;height:28px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.m{flex:1}
.m b{font-size:17px;display:block}
.m span{font-size:12px;color:var(--mu)}
.k{font-weight:700;color:var(--ac)}
label.t:has(input:checked){border-color:var(--ac);opacity:.75}
label.t:has(input:checked) .m b{text-decoration:line-through}
h2{font-size:16px;margin:20px 0 8px}
button{margin-top:14px;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:10px;padding:10px 14px;font-size:14px}

.pic{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--bd);background:#faf3e0}
.cap{text-align:center;font-weight:700;letter-spacing:2px;margin:8px auto 14px;font-size:14px}
#lock{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
#lock.off{display:none}
#lock img{width:100%;max-width:280px;height:auto;border-radius:16px;border:1px solid var(--bd)}
#lock h3{margin:4px 0 0;font-size:20px}
#lock input{width:160px;text-align:center;font-size:28px;letter-spacing:10px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
#lock button{margin:0;background:var(--ac);color:#fff;border:0;padding:12px 28px;font-size:16px;font-weight:600}
#lock .err{color:#c0392b;font-size:14px;min-height:18px}
.side{display:none}
.top,.bot{margin:0 auto 14px;max-width:300px}
@media(min-width:1000px){
.top,.bot,main>.cap{display:none}
.side{display:block;position:fixed;top:24px;width:230px}
.sl{left:max(16px,calc(50% - 280px - 260px))}
.sr{right:max(16px,calc(50% - 280px - 260px));width:200px}
.side img{margin-bottom:16px}
}
</style>
</head>

<button id="reset">Hepsini sıfırla</button>
</main>
<script>
var S=[[100000,"Başlangıç",1],[150000,"+%50",1.5],[200000,"+%33",2],[300000,"+%50",3],[400000,"+%33",4],[600000,"+%50",6],[800000,"+%33",8],[1200000,"+%50",12],[1600000,"+%33",16],[2000000,"+%25",20],[2500000,"+%25",25],[3000000,"+%20",30],[4000000,"+%33",40]];
var C=["Net hedef belirle","Risk yönetimini yap","Sermayeyi koru","Sürekli öğren","Sabırlı ve disiplinli ol","Stratejiye sadık kal","Duygularını kontrol et","Hedefe odaklan ve vazgeçme"];
var st={};
try{st=JSON.parse(localStorage.getItem("hedef40")||"{}")}catch(e){}
function save(){try{localStorage.setItem("hedef40",JSON.stringify(st))}catch(e){}}
function tl(n){return n.toLocaleString("tr-TR")+" TL"}
function usd(n){return "$"+Math.round(n/49).toLocaleString("en-US")}
function row(id,html,cls){
  var l=document.createElement("label");l.className="t";
  l.innerHTML='<input type="checkbox">'+html;
  var c=l.querySelector("input");c.checked=!!st[id];
  c.onchange=function(){st[id]=c.checked;save();upd()};
  l.dataset.id=id;return l;
}
var A=document.getElementById("stages"),B=document.getElementById("check");
S.forEach(function(s,i){
  A.appendChild(row("s"+i,'<span class="n">'+(i+1)+'</span><span class="m"><b>'+tl(s[0])+'</b><span>'+s[1]+' · '+usd(s[0])+'</span></span><span class="k">'+s[2]+'x</span>'));
});
C.forEach(function(t,i){B.appendChild(row("c"+i,'<span class="m"><b style="font-size:15px;font-weight:500">'+t+'</b></span>'))});
function upd(){
  var d=0,next=null;
  S.forEach(function(s,i){if(st["s"+i])d++;else if(next===null)next=s[0]});
  document.getElementById("cnt").textContent=d+"/13";
  document.getElementById("fill").style.width=(d/13*100)+"%";
  document.getElementById("cur").textContent=next?"Sıradaki hedef: "+tl(next):"🎉 Hedef tamam!";
}
(function(){
  var b=document.getElementById("reset"),t;
  b.onclick=function(){
    if(b.dataset.arm!=="1"){
      b.dataset.arm="1";b.textContent="Emin misin? Tekrar dokun";
      t=setTimeout(function(){b.dataset.arm="";b.textContent="Hepsini sıfırla"},3000);
      return;
    }
    clearTimeout(t);b.dataset.arm="";b.textContent="Hepsini sıfırla";
    st={};save();
    document.querySelectorAll("label.t input").forEach(function(c){c.checked=false});
    upd();
  };
})();
(function(){
  var L=document.getElementById("lock"),P=document.getElementById("pin"),E=document.getElementById("lerr");
  var src=document.querySelector("img.top");if(src)document.getElementById("lockpic").src=src.src;
  try{if(sessionStorage.getItem("unl")==="1")L.className="off"}catch(e){}
  function go(){
    if(P.value==="2712"){try{sessionStorage.setItem("unl","1")}catch(e){}L.className="off";P.value="";E.textContent=""}
    else if(P.value.length>=4){E.textContent="Yanlış şifre";P.value=""}
  }
  P.oninput=function(){E.textContent="";if(P.value.length===4)go()};
  P.onkeydown=function(e){if(e.key==="Enter")go()};
  document.getElementById("unlock").onclick=function(){if(P.value.length<4)E.textContent="4 haneli şifreyi gir";else go()};
})();
upd();
</script>
